// Nine Scrolls build 12.2 - audio wake-up for iOS Safari (run before the engine).
// iPhone only lets a page start Web Audio inside a touchEND / click, and it pauses
// ("suspended" / "interrupted") the audio again after calls, notifications, the
// lock screen or switching apps. Godot asks once, during touchstart, which iPhone
// ignores, so sound could stay off for a long time. We keep the engine's
// AudioContext and wake it on every touchend / click / key and whenever the page
// comes back, until it is running.
(function () {
	const Base = window.AudioContext || window.webkitAudioContext;
	if (!Base) { return; }
	const ctxs = [];
	const Wrapped = function (opts) {
		const c = new Base(opts);
		ctxs.push(c);
		return c;
	};
	Wrapped.prototype = Base.prototype;
	window.AudioContext = Wrapped;
	if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	const wake = function () {
		for (let i = 0; i < ctxs.length; i++) {
			const c = ctxs[i];
			if (c.state === 'running' || c.state === 'closed') { continue; }
			try {
				c.resume();
				// A one-sample silent buffer started inside the gesture is what
				// actually unlocks output on older iOS versions.
				const b = c.createBuffer(1, 1, c.sampleRate);
				const s = c.createBufferSource();
				s.buffer = b;
				s.connect(c.destination);
				s.start(0);
			} catch (err) {}
		}
	};
	const o = { capture: true, passive: true };
	window.addEventListener('touchend', wake, o);
	window.addEventListener('click', wake, o);
	window.addEventListener('keydown', wake, o);
	window.addEventListener('pageshow', wake);
	window.addEventListener('focus', wake);
	document.addEventListener('visibilitychange', function () {
		if (document.visibilityState === 'visible') { wake(); }
	});
	window.nsAudioState = function () { return ctxs.length ? ctxs[0].state : 'none'; };
}());
		</script>
		<script>
// Nine Scrolls build 9 - touch glide guards for iOS Safari (run before the engine).
(function () {
	const stop = function (e) { if (e.cancelable) { e.preventDefault(); } };
	const opts = { passive: false };
	// No page scroll / rubber-band / pinch while a thumb moves (Godot still gets the
	// canvas touch events first; this only blocks the browser's default handling).
	document.addEventListener('touchmove', stop, opts);
	document.addEventListener('gesturestart', stop, opts);
	document.addEventListener('gesturechange', stop, opts);
	document.addEventListener('gestureend', stop, opts);
	document.addEventListener('dblclick', stop, opts);
	document.addEventListener('contextmenu', stop, opts);
	document.addEventListener('selectstart', stop, opts);
	// Multi-finger touchstart outside the canvas must not zoom either.
	document.addEventListener('touchstart', function (e) {
		if (e.touches.length > 1 && e.target.id !== 'canvas') { stop(e); }
	}, opts);
	// Real touch timing: the browser's own event timestamps, so a quick tap or
	// flick that straddles a slow frame isn't measured as a long press.
	const tStart = {}, tEnd = {};
	let tCount = 0;
	const onStart = function (e) {
		if (++tCount > 64) {   // identifiers keep growing on iOS: forget old ones
			for (const k in tEnd) { delete tStart[k]; delete tEnd[k]; }
			tCount = 0;
		}
		for (let i = 0; i < e.changedTouches.length; i++) {
			const id = e.changedTouches[i].identifier;
			tStart[id] = e.timeStamp; delete tEnd[id];
		}
	};
	const onEnd = function (e) {
		for (let i = 0; i < e.changedTouches.length; i++) { tEnd[e.changedTouches[i].identifier] = e.timeStamp; }
	};
	window.addEventListener('touchstart', onStart, { capture: true, passive: true });
	window.addEventListener('touchend', onEnd, { capture: true, passive: true });
	window.addEventListener('touchcancel', onEnd, { capture: true, passive: true });
	window.nsTouchMs = function (id) {
		if (!(id in tStart)) { return -1; }
		return ((id in tEnd) ? tEnd[id] : performance.now()) - tStart[id];
	};
	// Sound: play even with the ringer switch on silent (iOS 16.4+ Web Audio session).
	try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (err) {}
	// Safe-area insets (CSS px) for the HUD, read by Godot via JavaScriptBridge.
	window.nsSafeArea = function () {
		const el = document.getElementById('ns-safe');
		if (!el) { return ''; }
		const cs = getComputedStyle(el);
		return [cs.paddingLeft, cs.paddingTop, cs.paddingRight, cs.paddingBottom, window.innerWidth, window.innerHeight]
			.map(function (v) { return parseFloat(v) || 0; }).join(',');
	};
}());

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":52340452,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
